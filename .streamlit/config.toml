# 다크 금융 리포트 테마 — 팔레트 A "차콜 + 시안" (U2)
# ★ hex 는 app/utils/theme.py PALETTE 와 정합 의무 (tests/test_theme.py CI 강제)

[theme]
base = "dark"
backgroundColor = "#131722"
secondaryBackgroundColor = "#1E222D"
textColor = "#D1D4DC"
primaryColor = "#29B6D1"
borderColor = "#2A2E39"
linkColor = "#29B6D1"
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
# U3: 숫자 위계 (카드 metric 값 크게)
metricValueFontSize = "2.5rem"
# U3: st.badge / :red[] 류 디렉티브 색을 탈채도 팔레트로 정렬
# (badge 매핑 = app/utils/theme.py BADGE_COLOR_MAP, test_theme 정합 강제)
redColor = "#E06C75"
greenColor = "#4DB6AC"
orangeColor = "#D4A04C"
grayColor = "#6B7280"

[theme.sidebar]
backgroundColor = "#1E222D"
borderColor = "#2A2E39"
